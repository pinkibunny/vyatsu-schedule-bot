name: Update schedule

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: schedule-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install parser
        run: pip install .

      - name: Fetch and parse current schedule
        run: python scripts/update_schedule.py --output data/schedule.json

      - name: Commit only actual changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update schedule"
          git push
