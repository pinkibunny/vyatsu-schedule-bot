[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vyatsu-schedule-bot"
version = "0.1.0"
description = "Telegram schedule bot for VyatSU group BTb-3101-03-00"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx[socks]>=0.27,<1",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
